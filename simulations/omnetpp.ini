[General]
network = simulations.HCCNetwork
*.visualizer.osgVisualizer.typename = ""
sim-time-limit = 100s
repeat = 5  # 5 runs per config for 95% Confidence Intervals
seed-set = ${runnumber}

# --- GLOBAL VISUALIZATION ---
*.visualizer.mediumVisualizer.displaySignals = false
*.visualizer.physicalLinkVisualizer.displayLinks = true
*.visualizer.dataLinkVisualizer.displayLinks = true

# --- DEFAULT HOST SETUP ---
*.host[*].numApps = 1
*.host[*].app[0].typename = "src.HCCApp"
*.host[*].app[0].localPort = 5000
*.host[*].app[0].destPort = 5000
*.host[*].app[0].beaconInterval = 1s

# --- DEFAULT RADIO (IEEE 802.11g) ---
*.host[*].wlan[0].typename = "Ieee80211Interface"
*.host[*].wlan[0].radio.transmitter.power = 2mW
*.host[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"
*.host[*].wlan[0].radio.bandName = "2.4 GHz"

*.host[*].mobility.typename = "RandomWaypointMobility"

# 1. Force the model to IGNORE the .ned file display string ("p=500,500")
*.host[*].mobility.initFromDisplayString = false

# 2. Explicitly set the STARTING position (Prevents NaN)
*.host[*].mobility.initialX = uniform(0m, 1000m)
*.host[*].mobility.initialY = uniform(0m, 1000m)
*.host[*].mobility.initialZ = 0m

# 3. Define the movement boundaries
*.host[*].mobility.constraintAreaMinX = 0m
*.host[*].mobility.constraintAreaMinY = 0m
*.host[*].mobility.constraintAreaMinZ = 0m
*.host[*].mobility.constraintAreaMaxX = 1000m
*.host[*].mobility.constraintAreaMaxY = 1000m
*.host[*].mobility.constraintAreaMaxZ = 10m  # Keep Z small but non-zero

# 4. Movement parameters
*.host[*].mobility.speed = uniform(5mps, 15mps)
*.host[*].mobility.updateInterval = 0.1s     # Essential for smooth updates

# ============================================================
# 1. TOPOLOGY SCENARIOS (Scalability)
# ============================================================
[Config Scalability_50Nodes]
description = "High density 50 nodes"
*.numHosts = 50

[Config Scalability_100Nodes]
description = "Very high density 100 nodes"
*.numHosts = 100

[Config MultiHop_Sparse]
description = "Sparse network forcing multi-hop"
*.numHosts = 10
*.host[*].wlan[0].radio.transmitter.power = 0.5mW # Reduces range

# ============================================================
# 2. MOBILITY MODELS
# ============================================================
[Config Mobility_Linear]
*.host[*].mobility.typename = "LinearMobility"
*.host[*].mobility.speed = 10mps 
*.host[*].mobility.angle = 45deg

[Config Mobility_Circle]
*.host[*].mobility.typename = "CircleMobility"
*.host[*].mobility.cx = 500m
*.host[*].mobility.cy = 500m
*.host[*].mobility.r = 300m
*.host[*].mobility.speed = 20mps

[Config Mobility_GaussMarkov]
*.host[*].mobility.typename = "GaussMarkovMobility"
*.host[*].mobility.alpha = 0.9
*.host[*].mobility.speed = 10mps
*.host[*].mobility.speedStdDev = 0.5mps  
*.host[*].mobility.angleStdDev = 40deg  
*.host[*].mobility.margin = 30m         

[Config Mobility_Mass]
*.host[*].mobility.typename = "MassMobility"
*.host[*].mobility.speed = uniform(5mps, 15mps)
*.host[*].mobility.changeInterval = uniform(1s, 3s)
*.host[*].mobility.angleDelta = uniform(-30deg, 30deg) 

# ============================================================
# 3. ENERGY MODELS (Life & Consumption)
# ============================================================
[Config Energy_Simple]
description = "Battery depletion test"
# Enable Simple Energy Storage
*.host[*].hasEnergyStorage = true
*.host[*].energyStorage.typename = "SimpleEpEnergyStorage"
*.host[*].energyStorage.nominalCapacity = 0.5J # Small capacity to force death quickly
*.host[*].energyStorage.initialCapacity = uniform(0.1J, 0.5J)

# Enable Consumer (Radio consumes energy)
*.host[*].wlan[0].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
*.host[*].wlan[0].radio.energyConsumer.transmitterConsumption = 100mW
*.host[*].wlan[0].radio.energyConsumer.receiverConsumption = 20mW
**.energyStorage.nodeStatusModule = "NULL"

# ============================================================
# 4. OBSTACLES
# ============================================================
[Config Obstacles_ConcreteWall]
description = "Radio propagation through obstacles"
*.physicalEnvironment.config = xmldoc("walls.xml") # You must create this simple XML
*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"

# ============================================================
# 5. TRAFFIC & APPLICATIONS (Throughput/Delay)
# ============================================================
[Config App_VideoTraffic]
description = "UDP Video Stream alongside HCC"

# Enable the second application ONLY here
*.host[*].numApps = 2 

# Host 0 sends video to Host 1
*.host[0].app[1].typename = "UdpBasicApp"
*.host[0].app[1].destAddresses = "host[1]"
*.host[0].app[1].destPort = 1000
*.host[0].app[1].messageLength = 1000B
*.host[0].app[1].sendInterval = 20ms

*.host[1].app[1].typename = "UdpSink"
*.host[1].app[1].localPort = 1000

[Config App_Ping]
description = "Ping traffic"
*.host[*].numApps = 2  # Enable second app
*.host[*].app[1].typename = "PingApp"
*.host[*].app[1].destAddr = "host[0]"
*.host[*].app[1].startTime = uniform(1s, 5s)

# ============================================================
# 6. ROUTING PROTOCOLS (Network Layer)
# ============================================================
# Note: HCCApp runs in App layer. These configs change how the OS routes *other* traffic.
[Config Net_AODV]
*.host[*].ipv4.routingTable.typename = "AodvRoutingTable"
*.host[*].typename = "AodvRouter" # Use AodvRouter type instead of AdhocHost if needed, or:
*.host[*].routing.typename = "Aodv"

[Config Net_GPSR]
*.host[*].routing.typename = "Gpsr"
*.host[*].routing.planarizationMode = "GG"

# ============================================================
# 7. PHY & MAC VARIATIONS
# ============================================================
[Config Phy_80211a_5GHz]
*.host[*].wlan[0].radio.bandName = "5.9 GHz"
*.host[*].wlan[0].opMode = "a"

[Config Phy_PathLoss_Rician]
*.radioMedium.pathLoss.typename = "RicianFading"
*.radioMedium.pathLoss.k = 8dB

[Config Phy_PathLoss_TwoRay]
*.radioMedium.pathLoss.typename = "TwoRayInterference"