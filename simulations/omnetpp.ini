[General]
network = simulations.HCCNetwork
*.visualizer.osgVisualizer.typename = ""
sim-time-limit = 100s
repeat = 5  # 5 runs per config for 95% Confidence Intervals
seed-set = ${runnumber}
# --- ADD THESE INSTEAD ---
**.result-recording-modes = 
**.scalar-recording = false
**.vector-recording = false

# --- GLOBAL VISUALIZATION ---
*.visualizer.mediumVisualizer.displaySignals = false
*.visualizer.physicalLinkVisualizer.displayLinks = true
*.visualizer.dataLinkVisualizer.displayLinks = true
*.visualizer.interfaceTableVisualizer.displayInterfaceTables = true
*.visualizer.energyStorageVisualizer.displayEnergyStorages = true
*.visualizer.energyStorageVisualizer.absPosition = true 

# --- DEFAULT HOST SETUP ---
*.host[*].numApps = 1
*.host[*].app[0].typename = "src.HCCApp"
*.host[*].app[0].localPort = 5000
*.host[*].app[0].destPort = 5000
*.host[*].app[0].beaconInterval = 1s
*.host[*].app[0].neighborValidityInterval = 4s


# --- DEFAULT RADIO (IEEE 802.11g) ---
*.host[*].wlan[0].typename = "Ieee80211Interface"
*.host[*].wlan[0].radio.transmitter.power = 2mW
*.host[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"
*.host[*].wlan[0].radio.bandName = "2.4 GHz"

# --- DEFAULT MOBILITY ---
*.host[*].mobility.typename = "RandomWaypointMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.initialX = uniform(0m, 1000m)
*.host[*].mobility.initialY = uniform(0m, 1000m)
*.host[*].mobility.initialZ = 0m
*.host[*].mobility.constraintAreaMinX = 0m
*.host[*].mobility.constraintAreaMinY = 0m
*.host[*].mobility.constraintAreaMinZ = 0m
*.host[*].mobility.constraintAreaMaxX = 1000m
*.host[*].mobility.constraintAreaMaxY = 1000m
*.host[*].mobility.constraintAreaMaxZ = 10m 
*.host[*].mobility.speed = uniform(5mps, 15mps)
*.host[*].mobility.updateInterval = 0.1s


[Config Final_Analysis]
description = "Full System Analysis: Clustering + Video Traffic + Energy + Delay"

# ============================================================
# 1. CRITICAL STABILITY FIX (The Allowlist Strategy)
# ============================================================
# Disable ALL recording by default. This prevents crashes on complex objects.
**.result-recording-modes = 
**.vector-recording = false
**.scalar-recording = false
# Force silence the specific signals causing crashes
**.mac.dcf.linkBroken.result-recording-modes = count
**.mac.dcf.linkBroken.vector-recording = false
# ============================================================
# 2. SPECIFIC METRIC RECORDING
# ============================================================
# We explicitly re-enable ONLY the variables needed for your report.

# --- Energy Metrics ---
# Record residual energy as a vector (over time) and the final value
*.host[*].energyStorage.residualEnergyCapacity.vector-recording = true
*.host[*].energyStorage.residualEnergyCapacity.scalar-recording = true
*.host[*].energyStorage.residualEnergyCapacity.result-recording-modes = vector, last

# --- Video Traffic Metrics (App 1) ---
# Delay (Vector + Mean)
*.host[*].app[1].endToEndDelay.vector-recording = true
*.host[*].app[1].endToEndDelay.scalar-recording = true
*.host[*].app[1].endToEndDelay.result-recording-modes = vector, mean

# Throughput (Vector + Mean)
*.host[*].app[1].throughput.vector-recording = true
*.host[*].app[1].throughput.scalar-recording = true
*.host[*].app[1].throughput.result-recording-modes = vector, mean

# Packet Counts (Scalars only)
*.host[*].app[1].packetReceived.scalar-recording = true
*.host[*].app[1].packetReceived.result-recording-modes = count
*.host[*].app[1].packetSent.scalar-recording = true
*.host[*].app[1].packetSent.result-recording-modes = count

# --- HCC Clustering Metrics (App 0) ---
# Overhead (Total Sum)
*.host[*].app[0].controlOverhead.scalar-recording = true
*.host[*].app[0].controlOverhead.result-recording-modes = sum

# Role Changes (Count)
*.host[*].app[0].roleChanges.scalar-recording = true
*.host[*].app[0].roleChanges.result-recording-modes = count

# Gateway Bridging (Mean stats)
*.host[*].app[0].gatewayBridging.scalar-recording = true
*.host[*].app[0].gatewayBridging.result-recording-modes = mean, max

# ============================================================
# 3. APPLICATION SETUP
# ============================================================
*.host[*].numApps = 2

# App 0: Your HCC Clustering Algorithm
*.host[*].app[0].typename = "src.HCCApp"
# (Inherits generic settings from [General])

# App 1: User Traffic (Video Stream Proxy)
*.host[*].app[1].typename = "UdpBasicApp"
*.host[*].app[1].destAddresses = "host[0]" 
*.host[*].app[1].destPort = 1000
*.host[*].app[1].messageLength = 1000B
# High traffic video simulation (exponential interval)
*.host[*].app[1].sendInterval = exponential(0.1s) 
*.host[*].app[1].startTime = 5s
*.host[*].app[1].packetName = "VideoData"

# ============================================================
# 4. ENERGY MODEL
# ============================================================
*.host[*].hasStatus = true  
*.host[*].hasEnergyStorage = true
*.host[*].energyStorage.typename = "SimpleEpEnergyStorage"
*.host[*].energyStorage.nominalCapacity = 50J
*.host[*].energyStorage.initialCapacity = uniform(40J, 50J)
*.host[*].energyStorage.nodeStatusModule = "^.status"

# Radio Consumption
*.host[*].wlan[0].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
*.host[*].wlan[0].radio.energyConsumer.transmitterConsumption = 100mW
*.host[*].wlan[0].radio.energyConsumer.receiverConsumption = 20mW
*.host[*].wlan[0].radio.energyConsumer.sleepConsumption = 1mW

# ============================================================
# 5. ROUTING (AODV)
# ============================================================
*.host[*].ipv4.routingTable.typename = "AodvRoutingTable"
*.host[*].typename = "inet.node.inet.AodvRouter"

# ============================================================
# 1. TOPOLOGY SCENARIOS
# ============================================================
[Config Scalability_50Nodes]
description = "High density 50 nodes"
*.numHosts = 50

[Config Scalability_100Nodes]
description = "Very high density 100 nodes"
*.numHosts = 100

[Config MultiHop_Sparse]
description = "Sparse network forcing multi-hop"
*.numHosts = 10
*.host[*].wlan[0].radio.transmitter.power = 0.5mW 

# ============================================================
# 2. MOBILITY MODELS
# ============================================================
[Config Mobility_Linear]
*.host[*].mobility.typename = "LinearMobility"
*.host[*].mobility.speed = 10mps 
*.host[*].mobility.angle = 45deg

[Config Mobility_Circle]
*.host[*].mobility.typename = "CircleMobility"
*.host[*].mobility.cx = 500m
*.host[*].mobility.cy = 500m
*.host[*].mobility.r = 300m
*.host[*].mobility.speed = 20mps

[Config Mobility_GaussMarkov]
*.host[*].mobility.typename = "GaussMarkovMobility"
*.host[*].mobility.alpha = 0.9
*.host[*].mobility.speed = 10mps
*.host[*].mobility.speedStdDev = 0.5mps  
*.host[*].mobility.angleStdDev = 40deg  
*.host[*].mobility.margin = 30m          

[Config Mobility_Mass]
*.host[*].mobility.typename = "MassMobility"
*.host[*].mobility.speed = uniform(5mps, 15mps)
*.host[*].mobility.changeInterval = uniform(1s, 3s)
*.host[*].mobility.angleDelta = uniform(-30deg, 30deg) 

# ============================================================
# 3. ENERGY MODELS
# ============================================================
[Config Energy_Simple]
description = "Energy Consumption Analysis"
*.host[*].hasStatus = true 
*.host[*].hasEnergyStorage = true
*.host[*].energyStorage.typename = "SimpleEpEnergyStorage"
*.host[*].energyStorage.nominalCapacity = 50J 
*.host[*].energyStorage.initialCapacity = uniform(10J, 50J)
*.host[*].wlan[0].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
*.host[*].wlan[0].radio.energyConsumer.transmitterConsumption = 100mW
*.host[*].wlan[0].radio.energyConsumer.receiverConsumption = 20mW
*.host[*].wlan[0].radio.energyConsumer.sleepConsumption = 1mW
*.host[*].wlan[0].radio.energyConsumer.offConsumption = 0mW
*.host[*].energyStorage.nodeStatusModule = "^.status"
*.host[*].energyStorage.residualEnergyCapacity.result-recording-modes = vector, last

# ============================================================
# 4. OBSTACLES
# ============================================================
[Config Obstacles_ConcreteWall]
description = "Radio propagation through obstacles"
*.physicalEnvironment.config = xmldoc("walls.xml")
*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"

# ============================================================
# 5. TRAFFIC & APPLICATIONS
# ============================================================
[Config App_VideoTraffic]
description = "UDP Video Stream alongside HCC"
*.host[*].numApps = 2 
*.host[0].app[1].typename = "UdpBasicApp"
*.host[0].app[1].destAddresses = "host[1]"
*.host[0].app[1].destPort = 1000
*.host[0].app[1].messageLength = 1000B
*.host[0].app[1].sendInterval = 20ms
*.host[1].app[1].typename = "UdpSink"
*.host[1].app[1].localPort = 1000

[Config App_Ping]
description = "Ping traffic"
*.host[*].numApps = 2 
*.host[*].app[1].typename = "PingApp"
*.host[*].app[1].destAddr = "host[0]"
*.host[*].app[1].startTime = uniform(1s, 5s)

# ============================================================
# 6. ROUTING PROTOCOLS
# ============================================================
[Config Net_AODV]
*.host[*].ipv4.routingTable.typename = "AodvRoutingTable"
*.host[*].typename = "inet.node.inet.AodvRouter"
*.host[*].routing.typename = "Aodv"

[Config Net_GPSR]
*.host[*].routing.typename = "Gpsr"
*.host[*].routing.planarizationMode = "GG"

# ============================================================
# 7. PHY & MAC VARIATIONS
# ============================================================
[Config Phy_80211a_5GHz]
*.host[*].wlan[0].radio.bandName = "5.9 GHz"
*.host[*].wlan[0].opMode = "a"

[Config Phy_PathLoss_Rician]
*.radioMedium.pathLoss.typename = "RicianFading"
*.radioMedium.pathLoss.k = 8dB

[Config Phy_PathLoss_TwoRay]
*.radioMedium.pathLoss.typename = "TwoRayInterference"